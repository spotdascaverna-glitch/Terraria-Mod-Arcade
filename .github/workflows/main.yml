
name: Build TMA Loader Android 0.3.0

on:
  push:
    paths:
      - 'TMA_Loader_ARM32_0.3.0_SOURCE.zip'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip TMA_Loader_ARM32_0.3.0_SOURCE.zip -d source
          test -d source/TMA_Loader_ARM32_0.3.0/app/src/main
          test -f source/TMA_Loader_ARM32_0.3.0/settings.gradle

      - name: Upload complete source project
        uses: actions/upload-artifact@v4
        with:
          name: TMA-Loader-Android-0.3.0-SOURCE
          path: source/TMA_Loader_ARM32_0.3.0/
          if-no-files-found: error

      - name: Build APK
        working-directory: source/TMA_Loader_ARM32_0.3.0
        run: gradle assembleDebug

      - name: Verify APK
        run: |
          APK="source/TMA_Loader_ARM32_0.3.0/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "APK não encontrado ou está vazio."
            exit 1
          fi
          stat -c%s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          echo "APK verificado com sucesso!"

      - name: Upload APK separately
        uses: actions/upload-artifact@v4
        with:
          name: TMA-Loader-APK-0.3.0
          path: source/TMA_Loader_ARM32_0.3.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
