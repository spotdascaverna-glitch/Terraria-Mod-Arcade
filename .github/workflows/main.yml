
name: Build TMA Loader Android

on:
  push:
    paths:
      - 'TMA_Loader_ARM32_0.2.0_SOURCE.zip'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip TMA_Loader_ARM32_0.2.0_SOURCE.zip -d source

      - name: Build APK
        working-directory: source/TMA_Loader_ARM32_0.2.0
        run: gradle assembleDebug

      - name: Verify APK
        run: |
          APK="source/TMA_Loader_ARM32_0.2.0/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 18000
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TMA-Loader-Android-0.2.0
          path: source/TMA_Loader_ARM32_0.2.0/app/build/outputs/apk/debug/app-debug.apk
          
