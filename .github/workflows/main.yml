name: Build TMA Loader ARM32 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TMA_Loader_ARM32_0.1.0_SOURCE.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q TMA_Loader_ARM32_0.1.0_SOURCE.zip -d extracted

      - name: Build APK
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle | head -n 1 | xargs dirname)
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TMA-Loader-ARM32-0.1.0
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          
