name: Build TMA Loader Android 0.5.0

on:
  push:
    paths:
      - 'TMA_Loader_ARM32_0.5.0_SOURCE.zip'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip TMA_Loader_ARM32_0.5.0_SOURCE.zip -d source
          test -f source/TMA_Loader_ARM32_0.5.0/app/src/main/java/com/spotdascaverna/tmaloader/MainActivity.java
          test -f source/TMA_Loader_ARM32_0.5.0/settings.gradle
          grep -q "versionCode 5" source/TMA_Loader_ARM32_0.5.0/app/build.gradle
          grep -q "versionName '0.5.0'" source/TMA_Loader_ARM32_0.5.0/app/build.gradle

      - name: Upload complete source project
        uses: actions/upload-artifact@v4
        with:
          name: TMA-Loader-Android-0.5.0-SOURCE
          path: source/TMA_Loader_ARM32_0.5.0/
          if-no-files-found: error

      - name: Build APK
        working-directory: source/TMA_Loader_ARM32_0.5.0
        run: gradle assembleDebug

      - name: Verify APK metadata and signature
        run: |
          APK="source/TMA_Loader_ARM32_0.5.0/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.spotdascaverna.tmaloader' versionCode='5' versionName='0.5.0'" apk-badging.txt
          grep -q "sdkVersion:'23'" apk-badging.txt
          echo "APK validado:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TMA-Loader-APK-0.5.0
          path: source/TMA_Loader_ARM32_0.5.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
